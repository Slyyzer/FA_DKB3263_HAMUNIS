<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teachable Machine</title>
</head>

<body>

    <h2>Teachable Machine Image Model</h2>

    <button type="button" onclick="init()">Start</button>

    <div id="status"></div>

    <div id="webcam-container"></div>

    <div id="label-container"></div>


    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>


    <script>

        // =========================
        // MODEL LOCATION
        // =========================

        const URL = "./my_model/";


        let model;
        let webcam;
        let labelContainer;
        let maxPredictions;


        // =========================
        // START
        // =========================

        async function init() {

            const status = document.getElementById("status");

            try {

                status.innerHTML = "Loading AI model...";

                // Model files
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";


                // Load AI model
                model = await tmImage.load(modelURL, metadataURL);

                maxPredictions = model.getTotalClasses();


                status.innerHTML = "AI model loaded. Opening camera...";


                // =========================
                // CAMERA
                // =========================

                const flip = true;

                webcam = new tmImage.Webcam(400, 400, flip);

                await webcam.setup();

                await webcam.play();


                status.innerHTML = "Camera started successfully!";


                // Start loop
                window.requestAnimationFrame(loop);


                // Put webcam on webpage
                document
                    .getElementById("webcam-container")
                    .appendChild(webcam.canvas);


                // Create prediction labels
                labelContainer =
                    document.getElementById("label-container");

                for (let i = 0; i < maxPredictions; i++) {

                    labelContainer.appendChild(
                        document.createElement("div")
                    );

                }

            }

            catch (error) {

                console.error(error);

                status.innerHTML =
                    "<h3 style='color:red;'>Camera Error</h3>" +
                    "<p>" + error.name + "</p>" +
                    "<p>" + error.message + "</p>";

            }

        }


        // =========================
        // WEBCAM LOOP
        // =========================

        async function loop() {

            webcam.update();

            await predict();

            window.requestAnimationFrame(loop);

        }


        // =========================
        // AI PREDICTION
        // =========================

        async function predict() {

            const prediction =
                await model.predict(webcam.canvas);


            for (let i = 0; i < maxPredictions; i++) {

                const classPrediction =
                    prediction[i].className +
                    ": " +
                    prediction[i].probability.toFixed(2);


                labelContainer.childNodes[i]
                    .innerHTML = classPrediction;

            }

        }

    </script>

</body>

</html>
